name: e5-unbound

services:
  client:
    build: ./client
    environment:
      RESOLVER_IP: 10.80.0.53
    networks:
      dnsnet:
        ipv4_address: 10.80.0.10

  resolver:
    build:
      context: .
      dockerfile: resolver/Dockerfile
      additional_contexts:
        unbound_src: ../unbound
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      PYTHONUNBUFFERED: "1"
      RESOLVER_IP: 10.80.0.53
      R2_MIN_SAMPLES: ${R2_MIN_SAMPLES:-8}
      R2_ENTROPY_THRESHOLD: ${R2_ENTROPY_THRESHOLD:-6.0}
      R2_UNIQUE_RATIO_THRESHOLD: ${R2_UNIQUE_RATIO_THRESHOLD:-0.90}
      FRAG2_WINDOW_SECONDS: ${FRAG2_WINDOW_SECONDS:-2.0}
      DEFENSE_MODE: ${DEFENSE_MODE:-on}
      FRAGSIZE: ${FRAGSIZE:-40}
      DNS_LEN: ${DNS_LEN:-120}
      AUTH_IP: 10.80.0.100
      POISON_IP: 6.6.6.6
    networks:
      dnsnet:
        ipv4_address: 10.80.0.53

  auth:
    build: ./auth
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      PYTHONUNBUFFERED: "1"
      AUTH_IP: 10.80.0.100
      ATTACKER_IP: 10.80.0.200
      AUTH_DELAY_SECONDS: ${AUTH_DELAY:-0.25}
      FRAGSIZE: ${FRAGSIZE:-40}
      DNS_LEN: ${DNS_LEN:-120}
      IPID_SPACE: ${IPID_SPACE:-2048}
    networks:
      dnsnet:
        ipv4_address: 10.80.0.100

  attacker:
    build: ./attacker
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      PYTHONUNBUFFERED: "1"
      RESOLVER_IP: 10.80.0.53
      AUTH_IP: 10.80.0.100
      RESOLVER_UPSTREAM_PORT: 33333
      IPID_SPACE: ${IPID_SPACE:-2048}
      POISON_IP: 6.6.6.6
      FRAGSIZE: ${FRAGSIZE:-40}
      DNS_LEN: ${DNS_LEN:-120}
      OCCUPANCY_SRC: 10.80.0.200
    networks:
      dnsnet:
        ipv4_address: 10.80.0.200

networks:
  dnsnet:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1500"
    ipam:
      config:
        - subnet: 10.80.0.0/24
